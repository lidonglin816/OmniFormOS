<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测试与数据管理 · OmniFormOS</title><link rel="stylesheet" href="/workspace-data.css"><script src="/theme-init.js"></script><link rel="stylesheet" href="/workspace-theme.css"><script type="module" src="/workspace-theme.js"></script><main><header><div><small>OMNIFORM OS / DATA MANAGEMENT</small><h1>测试与数据管理</h1><p>测试记录、业务记录与回收站统一管理。删除可恢复，不提供永久清空。</p></div><a href="/#home">返回工作区</a></header><section class="filters"><label>模块<select id="module"><option value="exam">ExamCraft</option><option value="flow">FlowForm</option><option value="doc">DocMorph</option><option value="adapt">AdaptForm</option><option value="table">TableMind</option><option value="lab">LabForm</option><option value="canvas">AppCanvas</option><option value="pilot">FormPilot</option></select></label><label>数据范围<select id="scope"><option value="active">当前记录</option><option value="trash">回收站</option></select></label><label>记录类型<select id="type"><option value="">全部类型</option></select></label><label>数据标记<select id="mode"><option value="">全部</option><option value="test">测试数据</option><option value="candidate">疑似测试（待确认）</option><option value="business">正式业务</option><option value="unclassified">未分类</option></select></label><label>查找记录<input id="query" type="search" placeholder="名称、记录ID"></label><button id="refresh">刷新</button><a id="open-module" href="/#exam" target="_blank" rel="noopener">打开对应模块</a></section><p class="notice">考试数据继承教师会话，流程数据继承流程管理会话。若提示会话缺失，请先打开对应模块，再返回刷新。测试标记不改变原业务评分或流程状态；删除后统计随真实记录更新。</p><div id="error" role="alert"></div><section class="toolbar"><span id="count"></span><button id="select">选择全部筛选结果</button><button id="clear">取消选择</button><button data-action="test">标记为测试</button><button data-action="business">标记为正式业务</button><button data-action="trash" class="danger">批量移入回收站</button><button data-action="restore" hidden>批量恢复</button></section><div class="table-wrap"><table>
